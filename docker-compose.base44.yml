services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        CI=true pnpm install --frozen-lockfile --config.strictDepBuilds=false
        exec pnpm dev --host 0.0.0.0 --port 5173
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - noor_node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: on-failure
    labels:
      base44.project: "وب‌سایت مجموعه نورالثقلین"
      base44.kind: web
      base44.port: "3000"

volumes:
  noor_node_modules:
